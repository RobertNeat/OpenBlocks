<main class="shell">
  <section class="window" aria-label="OpenBricks">
    <header class="titlebar">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>OpenBricks</h1>
      <div class="titlebar__actions">
        <button type="button" [class.is-active]="language() === 'pl'" (click)="setLanguage('pl')">PL</button>
        <button type="button" [class.is-active]="language() === 'en'" (click)="setLanguage('en')">EN</button>
      </div>
    </header>

    <div class="game-layout">
      <div class="board-frame">
        <canvas #boardCanvas aria-label="OpenBricks board"></canvas>
      </div>

      <aside class="side-panel">
        <section class="panel">
          <h2>{{ text().next }}</h2>
          <canvas #nextCanvas aria-label="Next piece"></canvas>
        </section>

        <section class="panel stats">
          <span>{{ text().score }}</span>
          <strong>{{ score() }}</strong>
          <span>{{ text().best }}</span>
          <strong>{{ highScore() }}</strong>
          <span>{{ text().lines }}</span>
          <strong>{{ lines() }}</strong>
          <span>{{ text().level }}</span>
          <strong>{{ level() }}</strong>
        </section>

        <section class="panel actions">
          <p
            class="status"
            [class.running]="statusClass() === 'running'"
            [class.paused]="statusClass() === 'paused'"
            [class.game-over]="statusClass() === 'game-over'"
          >
            {{ status() }}
          </p>
          <button type="button" (click)="start()">{{ text().start }}</button>
          <button type="button" (click)="togglePause()">{{ statusClass() === 'paused' ? text().resume : text().pause }}</button>
          <button type="button" (click)="restart()">{{ text().restart }}</button>
        </section>
      </aside>
    </div>

    <footer class="controls" aria-label="Keyboard controls">
      <span>← → {{ text().move }}</span>
      <span>↓ Soft</span>
      <span>Space {{ text().drop }}</span>
      <span>Z / ↑ X {{ text().rotate }}</span>
      <span>P / Esc</span>
      <span>R</span>
    </footer>
  </section>
</main>
