name: Deploy Docker Compose over SSH
description: Copy compose file and deploy an exact immutable image SHA.
inputs:
  host: { required: true }
  user: { required: true }
  registry: { required: true }
  compose-file: { required: true }
  remote-dir: { required: true }
  sha: { required: true }
runs:
  using: composite
  steps:
    - name: Create remote directory
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        REMOTE_DIR: ${{ inputs.remote-dir }}
      run: |
        set -euo pipefail
        remote_dir_q="$(printf '%q' "$REMOTE_DIR")"
        ssh -o BatchMode=yes "$SSH_USER@$HOST" "mkdir -p -- $remote_dir_q"

    - name: Copy compose definition
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        REMOTE_DIR: ${{ inputs.remote-dir }}
      run: scp "$COMPOSE_FILE" "$SSH_USER@$HOST:$REMOTE_DIR/compose.yml"

    - name: Pull and deploy
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        REMOTE_DIR: ${{ inputs.remote-dir }}
        REGISTRY: ${{ inputs.registry }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        remote_dir_q="$(printf '%q' "$REMOTE_DIR")"
        registry_q="$(printf '%q' "$REGISTRY")"
        sha_q="$(printf '%q' "$SHA")"
        ssh -o BatchMode=yes "$SSH_USER@$HOST" \
          "cd $remote_dir_q && REGISTRY=$registry_q IMAGE_TAG=$sha_q docker compose pull && REGISTRY=$registry_q IMAGE_TAG=$sha_q docker compose up -d --remove-orphans && docker image prune -f"
