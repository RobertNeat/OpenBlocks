name: Check Python project
description: Install the requested Python runtime with mise, use uv for the project environment, then run quality, security, tests and build.
inputs:
  path:
    required: true
  version:
    description: Python version managed by mise, e.g. 3.12 or 3.13
    required: true
runs:
  using: composite
  steps:
    - name: Prepare Python runtime
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        command -v mise >/dev/null
        command -v uv >/dev/null
        mise exec "python@${PYTHON_VERSION}" -- python --version
        uv --version

    - name: Verify security tools
      shell: bash
      run: |
        set -euo pipefail
        trivy --version
        semgrep --version

    - name: Sync dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv sync --frozen

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv run ruff check .

    - name: Format check
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv run ruff format --check .

    - name: Type check
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv run mypy .

    - name: Dependency vulnerabilities
      shell: bash
      working-directory: ${{ inputs.path }}
      run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln .

    - name: SAST
      shell: bash
      working-directory: ${{ inputs.path }}
      run: semgrep scan --config auto --error .

    - name: Unit tests
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv run pytest

    - name: Build without publishing
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON_VERSION: ${{ inputs.version }}
      run: |
        PYTHON_BIN="$(mise exec "python@${PYTHON_VERSION}" -- which python)"
        UV_PYTHON="$PYTHON_BIN" uv build
