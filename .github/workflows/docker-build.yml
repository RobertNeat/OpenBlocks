name: Build Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: 192.168.1.162:5000
  IMAGE_NAME: openblocks/app

jobs:
  docker-build:
    runs-on:
      - self-hosted
      - linux
      - production

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image tags
        run: |
          echo "IMAGE_SHA=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
