name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on:
      - self-hosted
      - linux
      - production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --watch=false
